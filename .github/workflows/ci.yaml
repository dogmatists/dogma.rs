# See: https://docs.github.com/en/actions/writing-workflows
---
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
  check-clippy:
    name: Check Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  check-docs:
    name: Check documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps
  check-package:
    name: Check packaged doctests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Package workspace
        run: cargo package --workspace
      - name: Test packaged documentation
        run: |
          version=$(< VERSION)
          components=(dogma-traits dogma-path dogma-uri dogma-uuid)
          patches=()
          # Resolve unpublished siblings from the extracted packages, not checkout.
          for package in "${components[@]}"; do
            path="$PWD/target/package/$package-$version"
            patches+=(--config "patch.crates-io.$package.path=\"$path\"")
          done
          for package in "${components[@]}" dogma; do
            manifest="target/package/$package-$version/Cargo.toml"
            args=(--manifest-path "$manifest" --doc)
            if [[ "$package" == dogma ]]; then
              args+=("${patches[@]}")
            fi
            cargo test "${args[@]}"
            cargo test "${args[@]}" --all-features
            cargo test "${args[@]}" --no-default-features
            cargo test "${args[@]}" --no-default-features --features all
          done
  check-features:
    name: Check feature combinations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: thumbv7em-none-eabihf
      - name: Check without default features
        run: |
          cargo check --workspace --no-default-features
          for package in dogma dogma-traits dogma-path dogma-uri dogma-uuid; do
            cargo check -p "$package" --no-default-features
            cargo check -p "$package" --no-default-features --features all
          done
      - name: Check umbrella features
        run: |
          for feature in all alloc std unstable enums iri uri structs traits \
            collection countable labeled named path uuid camino clap miette serde; do
            cargo check -p dogma --no-default-features --features "$feature"
          done
      - name: Check component features
        run: |
          for feature in alloc std collection countable labeled named serde; do
            cargo check -p dogma-traits --no-default-features --features "$feature"
          done
          for feature in std camino serde; do
            cargo check -p dogma-path --no-default-features --features "$feature"
          done
          for feature in std enums structs iri uri clap miette serde; do
            cargo check -p dogma-uri --no-default-features --features "$feature"
          done
          cargo check -p dogma-uuid --no-default-features --features std
      - name: Check identifier feature combinations
        run: |
          for package in dogma dogma-uri; do
            for identifier in iri uri all; do
              for feature in std clap miette serde; do
                cargo check -p "$package" --no-default-features \
                  --features "$identifier,$feature"
              done
            done
          done
      - name: Check no_std target
        run: |
          for package in dogma dogma-traits dogma-path dogma-uri dogma-uuid; do
            cargo check -p "$package" --no-default-features --features all \
              --target thumbv7em-none-eabihf
          done
          for feature in iri uri all; do
            cargo check -p dogma-uri --no-default-features --features "$feature" \
              --target thumbv7em-none-eabihf
          done
  build-ubuntu:
    name: Build on Ubuntu (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.97.0", stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Build
        run: cargo build --workspace
      - name: Build examples
        run: cargo build --workspace --examples
      - name: Run tests
        run: cargo test --workspace
      - name: Run all-feature tests
        run: cargo test --workspace --all-features
      - name: Run no_std tests
        run: cargo test --workspace --no-default-features --features all
      - name: Run minimal-feature IRI tests
        run: cargo test -p dogma-uri --no-default-features --features iri,std
      - name: Run minimal-feature URI tests
        run: cargo test -p dogma-uri --no-default-features --features uri,std
      - name: Run umbrella forwarding tests
        run: cargo test -p dogma --no-default-features --features all,camino,clap,miette
  build-windows:
    name: Build on Windows (${{ matrix.toolchain }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.97.0", stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Build
        run: cargo build --workspace
      - name: Build examples
        run: cargo build --workspace --examples
      - name: Run tests
        run: cargo test --workspace
      - name: Run all-feature tests
        run: cargo test --workspace --all-features
      - name: Run no_std tests
        run: cargo test --workspace --no-default-features --features all
      - name: Run minimal-feature IRI tests
        run: cargo test -p dogma-uri --no-default-features --features iri,std
      - name: Run minimal-feature URI tests
        run: cargo test -p dogma-uri --no-default-features --features uri,std
      - name: Run umbrella forwarding tests
        run: cargo test -p dogma --no-default-features --features all,camino,clap,miette
