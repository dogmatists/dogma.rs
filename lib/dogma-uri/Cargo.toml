[package]
name = "dogma-uri"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Validated URI and IRI types, authorities, and conversions."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["all", "std"]
all = ["enums", "serde", "structs"]
std = ["fluent-uri?/std", "iref?/std", "iri-string?/std", "known-schemes?/std", "serde?/std", "url?/std"]
enums = ["iri", "uri"]
iri = ["dep:iri-string", "dep:known-schemes"]
uri = ["iri"]
structs = ["iri", "uri"]
clap = ["dep:clap", "known-schemes?/clap", "std"]
email-address = ["dep:email_address", "uri", "std"]
fluent-uri = ["dep:fluent-uri", "uri"]
# iref 4.3 enables thiserror/std even with its defaults disabled.
iref = ["dep:iref", "uri", "std"]
iri-string = ["dep:iri-string", "uri"]
miette = ["dep:miette", "std"]
serde = ["dep:serde", "iri-string?/serde", "known-schemes?/serde"]
url = ["dep:url", "uri"]
uriparse = ["dep:uriparse", "uri", "std"]

[dependencies]
clap = { workspace = true, optional = true }
email_address = { workspace = true, optional = true }
fluent-uri = { workspace = true, optional = true }
iref = { workspace = true, optional = true }
iri-string = { workspace = true, optional = true }
known-schemes = { workspace = true, optional = true }
miette = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uriparse = { workspace = true, optional = true }

[dev-dependencies]
serde_test.workspace = true
