[package]
name = "dogma-uuid"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Universally unique identifiers and lossless byte conversions."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = ["alloc", "serde"]
alloc = []
std = ["alloc", "uuid/std", "serde?/std"]
arbitrary = ["uuid", "uuid/arbitrary"]
atomic = ["uuid", "uuid/atomic"]
borsh = ["uuid", "uuid/borsh"]
bytemuck = ["uuid", "uuid/bytemuck"]
js = ["uuid/js"]
serde = ["dep:serde", "uuid/serde"]
v1 = ["uuid", "uuid/v1"]
v3 = ["uuid", "uuid/v3"]
v4 = ["uuid/v4"]
v5 = ["uuid", "uuid/v5"]
v6 = ["uuid", "uuid/v6"]
v7 = ["uuid/v7"]
v8 = ["uuid", "uuid/v8"]
zerocopy = ["uuid", "uuid/zerocopy"]

# Interop:
uuid = []

[dependencies]
serde = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
serde_test.workspace = true
